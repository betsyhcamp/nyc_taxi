# TrainModelingConfig — project-owned parameters that change the numbers, for
# the monthly rollup, tiering, and weighting layered on top of tsbricks' weekly
# backtest. These are homeless in BacktestConfig, which is why evaluation_periods
# was previously an orphan key inside a tsbricks file, silently dropped on every
# run.
evaluation_periods:
  start_months: null # explicit list -> pin an experiment; null -> derive
  n_start_months: 6 # the full-run window backtest_config.yaml has always named
  start_month_step: 1
  forecast_horizon_months: 2

tiering:
  trailing_weeks: 52
  # The bin count is derived from len(tier_labels); there is no num_tiers.
  tier_labels: [very_low, low, middle, high, very_high]

weighting:
  trailing_weeks: 26
  dampening: cbrt

model_roles:
  # Values expand to the model set, deduplicated in declaration order. Each name
  # must have a config/train/models/<name>.yaml.
  benchmark: naive
  challenger: lightgbm

# Which columns each model consumes, and the callables final_fit resolves. Here
# rather than in model.hyperparameters, which is dict[str, Any] and so hides a
# typo from every validation stage.
model_settings:
  naive:
    # No callables: a naive model's parameters are its last observed values, so
    # freezing one registers a stale model. Inference refits from the panel.
    exog_features: []

  lightgbm:
    # The feature set the model trains on, so editing it moves every number.
    exog_features:
      - fiscal_week_of_month
      - fiscal_month
      - weeks_in_month
      - count_workdays
    fit_callable: fcstnyctaxi.models.lightgbm_weekly.lightgbm_weekly_fit
    save_callable: fcstnyctaxi.models.lightgbm_weekly.lightgbm_weekly_save
