# BacktestConfig, third layer. Allowed keys: {model}.
#
# The callables here are the pipeline's. notebooks/backtest_configs/model_weekly_lightgbm.yaml
# deliberately names different ones: a callable cannot tell a trimmed exogenous frame
# from a raw calendar, so one module cannot serve both contracts. Repointing these back
# re-merges them silently. experimental_models/README.md states the split; an earlier
# header here claimed the two files replicated each other.
#
# n_estimators is 1050, not the 1025 the calibration note records as adopted; the
# config is what ran, so the config is authoritative for reproduction.
#
# predict_callable is resolved by tsbricks through resolve_predict rather than
# resolve_model. No Training impl reads it yet.
model:
  fit_predict_callable: fcstnyctaxi.models.lightgbm_weekly.lightgbm_weekly
  predict_callable: fcstnyctaxi.models.lightgbm_weekly.lightgbm_weekly_predict
  hyperparameters:
    freq: W-SUN
    lags: [1, 52]
    rolling_mean_window: 4
    num_leaves: 31
    learning_rate: 0.05
    min_data_in_leaf: 125
    n_estimators: 1050
    n_jobs: 1
