[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fcstnyctaxi"
version = "0.1.0"
description = "NYC Yellow taxi demand modeling"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cloudpickle>=3.1.1",
    "fsspec>=2025.12.0",
    "gcsfs>=2025.12.0",
    "google-cloud-storage>=3.6.0",
    "kfp==2.17.0", # Pinned, not floored: compiling version written into every template
    "pandas>=2.3.0",
    "pydantic>=2.12.5",
    "tsbricks==0.4.0",
]

[dependency-groups]
extract = [
    "google-cloud-bigquery[bqstorage,pandas]>=3.38.0",
    "jinja2>=3.1.6",
]

forecasting = [
    "coreforecast>=0.0.16",
    "holidays>=0.86",
    "mlforecast==1.1.0",
    "scipy<1.16.0",
    "statsforecast>=2.0.1",
    "utilsforecast>=0.2.12",
    "lightgbm>=4.7.0"

]

train = [
    # Explicit, not {include-group = "forecasting"}: that group is the experimentation
    # stack (holidays, experimental_models/), so inheriting it would put every future
    # experiment's dependency in the image. Duplicating its specifiers is safe, since
    # uv.lock resolves one version per package.
    "mlforecast==1.1.0",
    "lightgbm>=4.7.0",
    "statsforecast>=2.0.1",
]

dev = [
    "ruff>=0.12.1",
    "ipykernel>=6.29.5",
    "jupytext>=1.17.2",
    "matplotlib>=3.10.3",
    "plotly>=6.1.2",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.4",
    "pre-commit>=4.5.0",
    "pre-commit-uv>=4.2.0",
    "uv==0.11.33",
    "sqlfluff>=3.5.0",
    "pytest>=9.0.2",
    "pytest-cov>=5.0.0",
    "streamlit>=1.52.1",
    "polars>=1.37.1",
    "pytest-mock>=3.15.1",
    "meteostat==2.0.1",
    "kaleido>=1.2.0",
    "mdformat>=0.7.17",
    "mdformat-gfm>=0.3.6",
    "sphinx>=7.0.0",
    "furo>=2024.0.0",
    "sphinx-autodoc-typehints>=2.0.0",
    "myst-parser>=3.0.0",
    "types-pyyaml>=6.0.12.20260408",
    "docker>=7.1.0",
    "google-cloud-aiplatform>=1.165.1,<2", # 1.x verified; 2.x breaks only agent tooling
    "python-dotenv>=1.0.0",
    "pandas-gbq>=0.31.0",
    "tsbricks[matplotlib]==0.4.0",
]

[tool.ruff]
extend-exclude = ["build", "dist", ".venv", "notebooks"]

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "uv.lock"
]

# Same as Black.
line-length = 88
indent-width = 4

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["fcstnyctaxi"]
branch = true
omit = ["src/fcstnyctaxi/pipelines/*"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.uv]
required-version = "==0.11.33"
default-groups = ["dev", "forecasting"]
constraint-dependencies = ["setuptools<81", "grpcio>=1.83.0"]

[tool.uv.sources]
tsbricks = { git = "https://github.com/betsyhcamp/tsbricks.git", rev = "v0.4.0" }

[tool.hatch.build.targets.wheel]
packages = ["src/fcstnyctaxi"]

[tool.ruff.lint]
# Enable Pyflakes (`F`), a subset of pycodestyle (`E`), and isort (`I`).
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = [
    "E4",  # import/syntax-related pycodestyle errors
    "E5",  # line too long & whitespace errors
    "E7",  # statement-level pycodestyle errors
    "E9",  # runtime errors (syntax errors at parse time)
    "F",   # pyflakes — undefined names, unused imports
    "I",   # isort — ruff format does not sort imports
    "UP",  # pyupgrade — modern Python syntax for 3.11+
    "B",   # flake8-bugbear — common design bugs, mutable defaults
    "TID251",  # banned-api only; the TID family adds relative-import rules
]
ignore = []

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

# runtime_paths names a container filesystem path, so only the layer that runs
# inside the container may import it. The quiet mistake this catches is a
# default argument — `config_dir: Path = CONFIG_DIR` passes every test that
# supplies the parameter, then resolves to /app/config for any caller that does
# not. The loud form already fails with FileNotFoundError.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"fcstnyctaxi.runtime_paths".msg = "Only components/ may know container paths. core/ and lib/ take config_dir: Path."
# PEP 563 makes annotations strings; KFP reads them as objects at decoration time
# and then reports a bogus artifact-type error. Removed repo-wide, banned here.
"__future__.annotations".msg = "KFP reads annotations as objects at decoration time; PEP 563 makes them strings and kfp reports a bogus artifact-type error. Quote a forward reference instead."

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable/Disable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
docstring-code-format = false

# Set the line length limit used when formatting code snippets in
# docstrings. This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"
