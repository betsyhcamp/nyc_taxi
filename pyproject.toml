[project]
name = "nyc-taxi"
version = "0.1.0"
description = "NYC Yellow taxi demand modeling"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cloudpickle>=3.1.1",
    "fsspec>=2025.12.0",
    "gcsfs>=2025.12.0",
    "google-cloud-aiplatform>=1.130.0",
    "google-cloud-bigquery[bqstorage,pandas]>=3.38.0",
    "google-cloud-storage>=3.6.0",
    "holidays>=0.86",
    "jinja2>=3.1.6",
    "mlforecast>=1.0.2",
    "pandas>=2.3.0",
    "pandas-gbq>=0.31.0",
    "pandera>=0.27.0",
    "pathlib>=1.0.1",
    "pydantic>=2.12.5",
    "statsforecast>=2.0.1",
    "scipy<1.16.0",
    "utilsforecast>=0.2.12",
    "coreforecast>=0.0.16",
    "kfp>=2.15.2",
    "tsbricks[matplotlib]==0.3.0",
]

[dependency-groups]
dev = [
    "ruff>=0.12.1",
    "ipykernel>=6.29.5",
    "jupytext>=1.17.2",
    "matplotlib>=3.10.3",
    "plotly>=6.1.2",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.4",
    "pre-commit>=4.5.0",
    "pre-commit-uv>=4.2.0",
    "sqlfluff>=3.5.0",
    "pytest>=9.0.2",
    "pytest-cov>=5.0.0",
    "streamlit>=1.52.1",
    "polars>=1.37.1",
    "pytest-mock>=3.15.1",
    "meteostat==2.0.1",
    "kaleido>=1.2.0",
    "mdformat>=0.7.17",
    "mdformat-gfm>=0.3.6",
    "sphinx>=7.0.0",
    "furo>=2024.0.0",
    "sphinx-autodoc-typehints>=2.0.0",
    "myst-parser>=3.0.0",
]


[tool.ruff]
extend-include = ["build", "dist", ".venv", "notebooks/**"]

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "uv.lock"
]

# Same as Black.
line-length = 88
indent-width = 4

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["fcstnyctaxi"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.uv.sources]
tsbricks = { git = "https://github.com/betsyhcamp/tsbricks.git", rev = "v0.3.0" }

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`) codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = ["E4", "E7", "E9", "F"]
ignore = []

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable/Disable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
docstring-code-format = false

# Set the line length limit used when formatting code snippets in
# docstrings. This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"
