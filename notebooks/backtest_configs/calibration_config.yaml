model: notebooks/backtest_configs/model_weekly_lightgbm.yaml
predict_callable: models.lightgbm_weekly.lightgbm_weekly_predict
truncation_adapter: models.lightgbm_weekly._set_lightgbm_iteration

calibration_periods:
  start_months: # calibration-only fiscal months, entirely before the backtest window
    - 202501
    - 202502
  forecast_horizon_months: 2   # mirrors the backtest's 2-month horizon (Framing A)

n_estimators_grid:
  ceiling: 1200
  step: 25