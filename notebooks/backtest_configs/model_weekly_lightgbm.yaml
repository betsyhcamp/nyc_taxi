model:
  fit_predict_callable: experimental_models.lightgbm_weekly_dev.lightgbm_weekly_dev
  predict_callable: experimental_models.lightgbm_weekly_dev.lightgbm_weekly_dev_predict
  hyperparameters:
    freq: W-SUN
    lags: [1, 52]
    rolling_mean_window: 4
    num_leaves: 31
    learning_rate: 0.05
    min_data_in_leaf: 125
    n_estimators: 1050
    n_jobs: 1
