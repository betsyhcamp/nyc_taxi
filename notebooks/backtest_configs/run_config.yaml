project:
  gcs_bucket: gs://nyc-taxi-ehc--modeling
  time_series_uri: dev/backtests/data/time_series.parquet
  fiscal_calendar_uri: dev/backtests/data/fiscal_calendar.parquet
  gcp_project: nyc-taxi-ehc

configs:
  backtest_config: notebooks/backtest_configs/backtest_config.yaml
  model: notebooks/backtest_configs/model_weekly_autoets.yaml

verification:
  # Registered run that compare_sidecars() checks this run against which is the prior
  # registration of the SAME model, not the leaderboard's scoring benchmark.
  # Must name a `model` in leaderboard_runs.yaml and must match the model
  # selected in configs.model above; change the two together.
  #   model_weekly_naive.yaml   <-> naive_26week
  #   model_weekly_autoets.yaml <-> autoets_26week
  #
  # Set null whenever this run is INTENDED to produce different output: a new
  # model, a different backtest window, a subset of periods (how lightgbm_2part
  # is built), or changed features/hyperparameters. compare_sidecars() asks only
  # "did this reproduce the registered run?", so any deliberate change makes
  # every check fail for expected reasons and the report stops being readable.
  # validate_sidecar() still runs and checks the new sidecar is well-formed.
  reference_model: autoets_26week

optuna: null   # populated when running Optuna tuning; null for fixed-hyperparameter runs
# optuna:
#   hero_metric: wrmae_pooled          # wrmae_per_series | wape
#   target: horizon_1                  # horizon_1 | horizon_2 | ...
#   direction: minimize                # Here, hero metrics are lower-is-better type metrics
#   benchmark_sidecar_uri: gs://nyc-taxi-ehc--modeling/dev/backtests/backtest_weekly/20260708T215706918568Z/
#   # benchmark_sidecar_uri: null when hero_metric: wape (no benchmark needed)
#   # n_trials: 100                    # Populate when backtest_weekly_optuna.py is implemented