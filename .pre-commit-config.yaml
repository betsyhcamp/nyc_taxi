# Pre-commit handles file utilities; Taskfile handles linting/formatting.
# CI runs: task pre-commit (which invokes pre-commit run --all-files).

minimum_pre_commit_version: "3.5.0"

exclude: '(\.ipynb$|^notebooks/)'

repos:
  # ============== File Utilities (native pre-commit) ==============
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: trailing-whitespace
        exclude: '\.md$'
      - id: end-of-file-fixer
      - id: check-yaml
        args: ["--unsafe"]
      - id: check-toml
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=500"]

  # ============== Project Checks (delegate to Taskfile) ==============
  - repo: local
    hooks:
      - id: task-lint
        name: task lint
        entry: task lint
        language: system
        pass_filenames: false
        types: [python]

      - id: task-format-check
        name: task format-check
        entry: task format-check
        language: system
        pass_filenames: false
        types: [python]

      - id: task-md-check
        name: task md-check
        entry: task md-check
        language: system
        pass_filenames: false
        types: [markdown]

  # SQLFluff: Automatic formatting fixes only (no linting) to use rules in .sqlfluff config file
  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 3.4.2
    hooks:
      - id: sqlfluff-fix
        args:
          - --config
          - .sqlfluff
          - --ignore=templating
        exclude: ^queries/debug_allowlist_.*\.sql$

  # Prevent committing debug_enabled:True so that debug mode isn't accidently run in prod
  - repo: local
    hooks:
      - id: forbid-debug-allowlist-enabled-regex
        name: Forbid debug_allowlist.debug_enabled:true in YAML (regex)
        entry: |
          bash -lc '
            pat="^[[:space:]-]*debug_enabled[[:space:]]*:[[:space:]]*true([[:space:]]|#|$)"
            out=$(grep -nEHi "$pat" "$@" | \
              grep -Ev "^[^:]+:[0-9]+:[[:space:]]*#")
            if [ -n "$out" ]; then
              echo "$out"
              echo "debug_enabled:true found. Turn it off before committing."
              exit 1
            fi
          '
        language: system
        pass_filenames: true
        files: ^(config\.ya?ml|config/.*\.(yml|yaml))$
