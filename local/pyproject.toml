[project]
name = "local"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "phitoduck", email = "eric.riddoch@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.4.3",
    "ipython-sql>=0.5.0",
    "pydantic>=2.12.5",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "jupyterlab>=4.5.2",
    "magic-duckdb>=0.2.4",
    "marimo[recommended]>=0.19.4",
]
